services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: urlshortenergo
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user1 -d urlshortenergo"]
      interval: 3s
      timeout: 3s
      retries: 10
